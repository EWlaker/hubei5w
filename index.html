<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>民國地形圖 · 湖北 五萬分一（397 幅）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:"Microsoft YaHei",system-ui,sans-serif}
  #map{position:absolute;inset:0;background:#22262c}
  .panel{position:absolute;top:12px;left:12px;z-index:1000;background:rgba(255,255,255,.95);
         border-radius:10px;padding:10px 12px;box-shadow:0 2px 12px rgba(0,0,0,.25);font-size:13px;line-height:1.75}
  .panel h1{margin:0 0 4px;font-size:15px;font-weight:700}
  .panel .sub{color:#888;font-size:11px}
  .panel label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .panel hr{border:0;border-top:1px solid #e5e5e5;margin:8px 0}
  .panel select{font-size:12px;padding:2px 4px;border-radius:4px;border:1px solid #ccc;background:#fff}
  #hint{position:absolute;bottom:12px;left:12px;z-index:1000;background:rgba(255,255,255,.9);
        border-radius:8px;padding:6px 10px;font-size:12px;color:#555}
  .sheetlabel{background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.2);border-radius:3px;
              padding:1px 4px;color:#1a1a1a;text-align:center;white-space:nowrap;
              box-shadow:0 1px 2px rgba(0,0,0,.2);line-height:1.2}
  .sheetlabel .nm{font-weight:700;font-size:11px}
  .sheetlabel .no{color:#a3541f;font-size:10px;letter-spacing:.2px}
  .gratlabel{background:transparent;border:0;box-shadow:none;color:#c0392b;font-size:11px;
             font-weight:700;padding:0;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
  .gratlabel::before{display:none}
  /* 卷帘 */
  #swipeBar{position:absolute;top:0;bottom:0;width:0;z-index:1200;display:none;pointer-events:none}
  #swipeBar.on{display:block}
  #swipeBar .hit{position:absolute;top:0;bottom:0;left:-16px;width:32px;pointer-events:auto;
                 cursor:ew-resize}
  #swipeBar .line{position:absolute;top:0;bottom:0;left:-1px;width:3px;background:#e8b64c;
                  box-shadow:0 0 0 1px rgba(0,0,0,.45),0 0 8px rgba(0,0,0,.5)}
  #swipeBar .knob{position:absolute;top:50%;left:-15px;margin-top:-15px;width:30px;height:30px;
                  border-radius:50%;background:#e8b64c;border:2px solid #fff;
                  pointer-events:none;box-shadow:0 1px 6px rgba(0,0,0,.5);
                  display:flex;align-items:center;justify-content:center;font-size:13px;color:#3a2a00}
  #swipeBar.dragging .knob{background:#ffd166;transform:scale(1.12)}
  #swipeBar .tag{position:absolute;top:12px;white-space:nowrap;background:rgba(255,255,255,.9);
                 border-radius:4px;padding:2px 7px;font-size:12px;color:#333;pointer-events:none}
  #swipeBar .tag.l{left:-96px}
  #swipeBar .tag.r{left:8px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>民國地形圖 · 湖北 五萬分一</h1>
  <div class="sub">民國時期地形圖 · 5 萬分一 · <b>397 幅</b><br>XYZ 瓦片 · EPSG:3857 · z5–14（z14 ≈ 8.2 m/px）</div>
  <hr>
  <label>底图 <select id="base">
    <option value="none">无（深色）</option>
    <option value="tdt_vec">天地图 · 矢量</option>
    <option value="tdt_img">天地图 · 影像</option>
    <option value="tdt_ter">天地图 · 地形</option>
    <option value="osm">OpenStreetMap</option>
  </select></label>
  <label><input type="checkbox" id="lyG" checked>图幅接合表（图名 + 图号）</label>
  <label><input type="checkbox" id="lyM" checked>经纬网（15′ / 整度注记）</label>
  <label><input type="checkbox" id="swipe">卷帘对比（左：历史图 / 右：底图）</label>
  <label>透明度 <input type="range" id="opa" min="30" max="100" value="100" style="width:110px;vertical-align:middle"></label>
  <div class="sub" id="tip">放大到 z9 以上显示图名与图号；白框处 = 本批未收该幅</div>
</div>
<div id="swipeBar"><div class="hit"></div><div class="line"></div><div class="knob">⇔</div>
  <div class="tag l">历史图</div><div class="tag r">底图</div></div>
<div id="hint">滚轮缩放 · 拖动平移</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===== 天地图 key：到 https://console.tianditu.gov.cn 免费申请后填这里 ===== */
const TDT_KEY = '4267820f43926eaf808d61dc07269beb';

const qs = new URLSearchParams(location.search);
const map = L.map('map', {
  center: [parseFloat(qs.get('lat') || 31.0), parseFloat(qs.get('lon') || 112.5)],
  zoom: parseInt(qs.get('z') || 7)
});
map.createPane('basemapPane');
map.getPane('basemapPane').style.zIndex = 150;   // 低于 tilePane(200)，历史地图始终压在上面
map.createPane('gratPane');
map.getPane('gratPane').style.zIndex = 350;      // 经纬网压在瓦片之上

/* ---------- 底图 ---------- */
function tdt(layer, key) {
  return L.tileLayer(
    'https://t{s}.tianditu.gov.cn/' + key + '/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0' +
    '&LAYER=' + layer + '&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles' +
    '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=' + TDT_KEY,
    {subdomains: '01234567', maxZoom: 18, pane: 'basemapPane', attribution: '© 天地图'});
}
const BASEMAPS = {
  none: null,
  tdt_vec: () => L.layerGroup([tdt('vec', 'vec_w'), tdt('cva', 'cva_w')]),
  tdt_img: () => L.layerGroup([tdt('img', 'img_w'), tdt('cia', 'cia_w')]),
  tdt_ter: () => L.layerGroup([tdt('ter', 'ter_w'), tdt('cta', 'cta_w')]),
  osm: () => L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
           {maxZoom: 19, pane: 'basemapPane', attribution: '© OpenStreetMap contributors'})
};

let baseLayer = null;
function setBase(kind) {
  if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }
  if (kind === 'none') return;
  if (kind.startsWith('tdt') && !TDT_KEY) {
    document.getElementById('tip').textContent = '没填天地图 key，已临时用 OSM';
    kind = 'osm';
  }
  baseLayer = BASEMAPS[kind]();
  if (baseLayer) baseLayer.addTo(map);
  document.getElementById('base').value = kind;
}
document.getElementById('base').onchange = e => {
  setBase(e.target.value);
  if (typeof applySwipe === 'function') { applySwipe(); setTimeout(applySwipe, 200); }
  if (document.getElementById('base').value === 'none' && document.getElementById('swipe').checked) {
    document.getElementById('tip').textContent = '卷帘需要底图，右侧会空白；可切回影像或关掉卷帘';
  }
};
setBase(qs.get('base') || 'none');

/* ---------- 瓦片 ---------- */
const TILE_V = 'v3';   // 数据更新时改这个，强制浏览器取新瓦片
const tiles = L.tileLayer('xyz_hubei_webp/{z}/{x}/{y}.webp?v=' + TILE_V, {
  minZoom: 5, maxZoom: 14, maxNativeZoom: 14,
  attribution: '民國地形圖 · 湖北五萬分一 · 397 幅'
}).addTo(map);
document.getElementById('opa').oninput = e => tiles.setOpacity(e.target.value / 100);

/* ---------- 图幅接合表 ---------- */
const LABEL_MIN_ZOOM = 9;
let grid = null;

fetch('sheets_index.geojson').then(r => r.json()).then(gj => {
  grid = L.geoJSON(gj, {
    style: () => ({color: '#d9a13b', weight: 1, fill: false, opacity: .8}),
    onEachFeature: (f, ly) => {
      const p = f.properties;
      ly.bindTooltip('<span class="nm">' + p.n + '</span><br><span class="no">' +
                     (p.a || '') + '</span>',
                     {permanent: true, direction: 'center', opacity: 1, className: 'sheetlabel'});
      ly.bindPopup('<b>' + p.n + '</b><br>圖號 ' + (p.a || '—') +
                   '<br><span style="color:#888">行 ' + p['行'] + ' 列 ' + p['列'] + '</span>');
    }
  });
  if (map.getZoom() >= LABEL_MIN_ZOOM) grid.addTo(map);
}).catch(e => { document.getElementById('tip').textContent = '接合表加载失败: ' + e; });

function syncGrid() {
  if (!grid) return;
  const want = document.getElementById('lyG').checked && map.getZoom() >= LABEL_MIN_ZOOM;
  if (want && !map.hasLayer(grid)) grid.addTo(map);
  if (!want && map.hasLayer(grid)) map.removeLayer(grid);
}
map.on('zoomend', syncGrid);
document.getElementById('lyG').onchange = syncGrid;

/* ---------- 经纬网 ---------- */
const GRAT_LABEL_MIN_ZOOM = 7;
let gratLines = null, gratLabels = null;

fetch('graticule.geojson').then(r => r.json()).then(gj => {
  gratLines = L.geoJSON(gj, {
    pane: 'gratPane',
    filter: f => f.geometry.type === 'LineString',
    style: f => f.properties.major
      ? {color: '#c0392b', weight: 1.1, opacity: .85, dashArray: null}
      : {color: '#e08a7a', weight: .7, opacity: .55, dashArray: '3,4'}
  });
  const pts = {type: 'FeatureCollection',
               features: gj.features.filter(f => f.geometry.type === 'Point')};
  gratLabels = L.geoJSON(pts, {
    pane: 'gratPane',
    pointToLayer: (f, ll) => L.circleMarker(ll, {
      radius: 0, opacity: 0, fillOpacity: 0, interactive: true}),
    onEachFeature: (f, ly) => ly.bindTooltip(f.properties.text, {
      permanent: true, direction: 'center', opacity: 1, className: 'gratlabel'})
  });
  syncGrid();          // 触发一次显隐同步
}).catch(e => { document.getElementById('tip').textContent = '经纬网加载失败: ' + e; });

const lyM = document.getElementById('lyM');
function syncGrat() {
  const on = lyM.checked;
  [gratLines, gratLabels].forEach(l => { if (!l) return; });
  if (gratLines) {
    if (on && !map.hasLayer(gratLines)) gratLines.addTo(map);
    if (!on && map.hasLayer(gratLines)) map.removeLayer(gratLines);
  }
  const wantLabels = on && map.getZoom() >= GRAT_LABEL_MIN_ZOOM;
  if (gratLabels) {
    if (wantLabels && !map.hasLayer(gratLabels)) gratLabels.addTo(map);
    if (!wantLabels && map.hasLayer(gratLabels)) map.removeLayer(gratLabels);
  }
}
lyM.onchange = syncGrat;
map.on('zoomend', syncGrat);

map.on('mousemove', ev => {
  const p = ev.latlng;
  document.getElementById('hint').textContent =
    'N' + p.lat.toFixed(4) + '  E' + p.lon.toFixed(4) + '  ·  z' + map.getZoom();
});

/* ---------- 卷帘对比 ---------- */
const bar = document.getElementById('swipeBar');
const barLine = bar.querySelector('.line');
const tilePaneEl = map.getPane('tilePane');
const basePaneEl = map.getPane('basemapPane');
const swipeBox = document.getElementById('swipe');
let swipePct = 50;

function applySwipe() {
  const on = swipeBox.checked;
  bar.classList.toggle('on', on);
  const panes = {
    tile: tilePaneEl,
    base: basePaneEl,
    grid: map.getPane('overlayPane'),
    label: map.getPane('tooltipPane')
  };
  Object.values(panes).forEach(el => {
    if (!el) return;
    el.style.clipPath = '';
    if (!on) { el.style.clip = ''; }
  });
  if (!on) return;

  // 关键：Leaflet 的 pane 是 0x0 的绝对定位元素。
  // 用 clip-path 会把子元素整块裁没（实测 Chromium），老式 clip:rect() 正常。
  const sz = map.getSize();
  const x = Math.round(sz.x * swipePct / 100);
  const H = Math.max(sz.y * 2 + 600, 4000);
  const LEFT = 'rect(0px, ' + x + 'px, ' + H + 'px, 0px)';
  const RIGHT = 'rect(0px, ' + sz.x + 'px, ' + H + 'px, ' + x + 'px)';
  if (panes.tile) panes.tile.style.clip = LEFT;
  if (panes.grid) panes.grid.style.clip = LEFT;      // 接合表只在历史图一侧
  if (panes.label) panes.label.style.clip = LEFT;    // 图名/图号也一样
  if (panes.base) panes.base.style.clip = RIGHT;
  bar.style.left = swipePct + '%';
}

function setSwipePct(clientX) {
  const r = map.getContainer().getBoundingClientRect();
  swipePct = Math.min(98, Math.max(2, (clientX - r.left) / r.width * 100));
  applySwipe();
}

let dragging = false;

function startDrag(e) {
  if (!swipeBox.checked) return;
  dragging = true;
  bar.classList.add('dragging');
  map.dragging.disable();                 // 拖卷帘时别让地图跟着平移
  document.body.style.cursor = 'ew-resize';
  moveDrag(e);
  if (e.cancelable) e.preventDefault();
  e.stopPropagation();
}
function moveDrag(e) {
  if (!dragging) return;
  if (e.buttons === 0 && !e.touches) { endDrag(); return; }   // 在窗口外松开也要收尾
  const t = e.touches ? e.touches[0] : e;
  if (!t) return;
  setSwipePct(t.clientX);
  if (e.cancelable) e.preventDefault();
}
function endDrag() {
  if (!dragging) return;
  dragging = false;
  bar.classList.remove('dragging');
  map.dragging.enable();
  document.body.style.cursor = '';
}

const hit = bar.querySelector('.hit');
hit.addEventListener('mousedown', startDrag);
hit.addEventListener('touchstart', startDrag, {passive: false});
hit.addEventListener('dragstart', e => e.preventDefault());
window.addEventListener('mousemove', moveDrag);
window.addEventListener('touchmove', moveDrag, {passive: false});
window.addEventListener('mouseup', endDrag);
window.addEventListener('touchend', endDrag);
window.addEventListener('touchcancel', endDrag);
window.addEventListener('blur', endDrag);
bar.addEventListener('mousedown', e => e.stopPropagation());

swipeBox.onchange = () => {
  if (swipeBox.checked && document.getElementById('base').value === 'none') {
    setBase('tdt_img');
    document.getElementById('tip').textContent = '卷帘需要底图，已自动切到天地图影像';
  }
  applySwipe();
  setTimeout(applySwipe, 120);
  setTimeout(applySwipe, 400);
};
map.on('resize zoomend moveend', applySwipe);

/* URL 参数：?swipe=1&pos=40 直接进卷帘；?base=tdt_img 指定底图 */
if (qs.get('swipe') === '1' || qs.get('swipe') === 'true') {
  swipeBox.checked = true;
  if (qs.get('pos')) {
    const v = parseFloat(qs.get('pos'));
    if (isFinite(v)) swipePct = Math.min(98, Math.max(2, v));
  }
  if (document.getElementById('base').value === 'none') setBase('tdt_img');
  applySwipe();
}

</script>
</body>
</html>
